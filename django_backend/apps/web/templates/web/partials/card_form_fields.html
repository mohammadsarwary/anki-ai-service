<label>
  <span>Front</span>
  <input name="front" type="text" placeholder="Departure" required>
</label>
<label>
  <span>Back</span>
  <textarea name="back" rows="7" placeholder="A flight leaving an airport" required></textarea>
</label>
<div class="form-grid">
  <label>
    <span>Difficulty</span>
    <select name="difficulty">
      <option value="">No difficulty</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
  </label>
  <label>
    <span>Pronunciation</span>
    <input name="pronunciation" type="text" placeholder="duh-PAR-chur">
  </label>
</div>
<label>
  <span>Example</span>
  <textarea name="example_sentence" rows="3" placeholder="Our departure is at noon."></textarea>
</label>
<label>
  <span>Tags</span>
  <input name="tags" type="text" placeholder="travel, airport">
</label>
